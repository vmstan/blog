name: Test and Deploy to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly rebuild so build-time data (Credly certifications) stays current
  # without a commit. Mondays at 12:00 UTC.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    name: Normalize content timestamps
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && 'main' || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Repair missing content timestamps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/update-updated-at.mjs --repair-range "$BEFORE_SHA" "$HEAD_SHA"

      - name: Commit timestamp repairs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- src/content/posts src/content/pages; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/posts src/content/pages
            git commit --no-verify -m "Update content timestamps"
            git push origin HEAD:main
          fi

      - name: Select tested commit
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Build and test
    needs: normalize
    if: >-
      always() &&
      (needs.normalize.result == 'success' || needs.normalize.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.normalize.outputs.commit || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Repair preview content timestamps
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/update-updated-at.mjs --repair-range "$BASE_SHA" "$HEAD_SHA"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      # The build regenerates src/styles/icons.css and the subset webfonts.
      # Nothing else would notice if they drifted from what is committed, so
      # fail here rather than let a stale icon ship.
      - name: Check generated icon assets are current
        run: |
          changed=$(git status --porcelain -- src/styles/icons.css src/styles/fonts)
          if [ -n "$changed" ]; then
            echo "::error::Generated icon assets differ from the committed ones. Run 'pnpm build:icons' and commit the result."
            echo "$changed"
            git diff -- src/styles/icons.css
            exit 1
          fi

  preview:
    name: Deploy preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      needs.test.result == 'success'
    needs: [normalize, test]
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.normalize.outputs.commit || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Repair preview content timestamps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/update-updated-at.mjs --repair-range "$BASE_SHA" "$HEAD_SHA"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Upload Worker preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Add preview link to pull request
        uses: actions/github-script@v9
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          VERSION_PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
          WRANGLER_OUTPUT: ${{ steps.preview.outputs.command-output }}
        with:
          script: |
            const marker = "<!-- cloudflare-preview -->";
            const wranglerOutput = process.env.WRANGLER_OUTPUT || "";
            const aliasMatch = wranglerOutput.match(
              /^Version Preview Alias URL:\s*(https:\/\/\S+)/m,
            );
            const previewUrl = aliasMatch?.[1] || process.env.VERSION_PREVIEW_URL;

            if (!previewUrl) {
              core.setFailed("Cloudflare did not return a preview URL.");
              return;
            }

            const shortSha = process.env.COMMIT_SHA.slice(0, 7);
            const body = `${marker}
            ### Cloudflare preview

            [Open the website preview](${previewUrl})

            Updated for \`${shortSha}\`.`;
            const parameters = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...parameters, per_page: 100 },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...parameters, body });
            }

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && needs.test.result == 'success'
    needs: [normalize, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.normalize.outputs.commit || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
